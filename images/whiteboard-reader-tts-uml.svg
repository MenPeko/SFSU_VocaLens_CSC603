<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">whiteboard-reader-tts UML component diagram</title>
  <desc id="desc">UML-style component diagram showing the Whiteboard Reader TTS app architecture, including Mentra glasses, Mentra Cloud, local AppServer and Bun server, Gemini OCR and translation services, SSE updates, and the React webview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6fbff" />
      <stop offset="100%" stop-color="#eef4f7" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f9fc" />
    </linearGradient>
    <linearGradient id="runtime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fdff" />
      <stop offset="100%" stop-color="#edf7fb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c3d4f" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33576b" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007b83" />
    </marker>
    <style>
      .title { font: 700 34px "Avenir Next", "Trebuchet MS", sans-serif; fill: #173142; }
      .subtitle { font: 400 16px "Avenir Next", "Trebuchet MS", sans-serif; fill: #4a6676; }
      .section { font: 700 18px "Avenir Next", "Trebuchet MS", sans-serif; fill: #173142; letter-spacing: 0.03em; }
      .stereotype { font: 600 12px "Menlo", "Consolas", monospace; fill: #007b83; }
      .boxTitle { font: 700 20px "Avenir Next", "Trebuchet MS", sans-serif; fill: #173142; }
      .boxText { font: 500 14px "Avenir Next", "Trebuchet MS", sans-serif; fill: #355463; }
      .mono { font: 600 13px "Menlo", "Consolas", monospace; fill: #284452; }
      .small { font: 500 12px "Avenir Next", "Trebuchet MS", sans-serif; fill: #577281; }
      .legendText { font: 500 13px "Avenir Next", "Trebuchet MS", sans-serif; fill: #355463; }
      .label { font: 600 13px "Avenir Next", "Trebuchet MS", sans-serif; fill: #27485a; }
      .caption { font: 600 12px "Menlo", "Consolas", monospace; fill: #27485a; }
      .solid { stroke: #33576b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .accent { stroke: #007b83; stroke-width: 3; fill: none; marker-end: url(#arrowAccent); }
      .dashed { stroke: #5c7d8f; stroke-width: 2.2; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .panel { fill: url(#panel); stroke: #c8d7e1; stroke-width: 1.5; rx: 28; filter: url(#shadow); }
      .runtime { fill: url(#runtime); stroke: #8bc2cf; stroke-width: 2; rx: 32; filter: url(#shadow); }
      .node { fill: #ffffff; stroke: #b7cad6; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .nodeAccent { fill: #fbffff; stroke: #7fc5cd; stroke-width: 1.8; rx: 20; filter: url(#shadow); }
      .note { fill: #fffdf4; stroke: #d8c87f; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="url(#bg)" />

  <text x="70" y="72" class="title">whiteboard-reader-tts</text>
  <text x="70" y="103" class="subtitle">UML component diagram of the current capture → OCR → translation → TTS flow in the Mentra app.</text>

  <rect x="52" y="140" width="310" height="820" class="panel" />
  <text x="78" y="178" class="section">External Actors</text>

  <rect x="86" y="208" width="240" height="112" class="node" />
  <text x="106" y="235" class="stereotype">&lt;&lt;actor&gt;&gt;</text>
  <text x="106" y="265" class="boxTitle">User</text>
  <text x="106" y="292" class="boxText">Short-presses a glasses button</text>

  <rect x="86" y="360" width="240" height="158" class="node" />
  <text x="106" y="387" class="stereotype">&lt;&lt;device&gt;&gt;</text>
  <text x="106" y="417" class="boxTitle">Mentra Live Glasses</text>
  <text x="106" y="445" class="boxText">Captures whiteboard photo</text>
  <text x="106" y="468" class="boxText">Receives text wall updates</text>
  <text x="106" y="491" class="boxText">Plays spoken output</text>

  <rect x="86" y="560" width="240" height="192" class="node" />
  <text x="106" y="587" class="stereotype">&lt;&lt;cloud service&gt;&gt;</text>
  <text x="106" y="617" class="boxTitle">Mentra Cloud</text>
  <text x="106" y="645" class="boxText">Starts sessions via webhook</text>
  <text x="106" y="668" class="boxText">Maintains session WebSocket</text>
  <text x="106" y="691" class="boxText">Coordinates photo capture/upload</text>
  <text x="106" y="714" class="boxText">Routes audio and display commands</text>

  <rect x="86" y="794" width="240" height="132" class="node" />
  <text x="106" y="821" class="stereotype">&lt;&lt;external API&gt;&gt;</text>
  <text x="106" y="851" class="boxTitle">Google Gemini API</text>
  <text x="106" y="879" class="boxText">OCR on captured image</text>
  <text x="106" y="902" class="boxText">Language detection + translation</text>

  <rect x="398" y="140" width="970" height="820" class="runtime" />
  <text x="430" y="178" class="section">Local App Runtime</text>
  <text x="430" y="201" class="small">Deployed from <tspan class="mono">cloud/packages/apps/whiteboard-reader-tts</tspan></text>

  <rect x="432" y="226" width="380" height="240" class="nodeAccent" />
  <text x="456" y="254" class="stereotype">&lt;&lt;AppServer&gt;&gt;</text>
  <text x="456" y="286" class="boxTitle">CaptionsApp</text>
  <text x="456" y="311" class="mono">src/app/CaptionsApp.ts</text>
  <text x="456" y="342" class="boxText">Extends <tspan class="mono">@mentra/sdk AppServer</tspan></text>
  <text x="456" y="365" class="boxText">Implements <tspan class="mono">onSession(session)</tspan></text>
  <text x="456" y="388" class="boxText">Subscribes to <tspan class="mono">onButtonPress()</tspan></text>
  <text x="456" y="411" class="boxText">Calls <tspan class="mono">camera.requestPhoto()</tspan></text>
  <text x="456" y="434" class="boxText">Calls <tspan class="mono">layouts.showTextWall()</tspan> and <tspan class="mono">audio.speak()</tspan></text>

  <rect x="846" y="226" width="486" height="240" class="nodeAccent" />
  <text x="870" y="254" class="stereotype">&lt;&lt;service&gt;&gt;</text>
  <text x="870" y="286" class="boxTitle">AppServer / Express Layer</text>
  <text x="870" y="311" class="mono">src/index.ts    port 3333</text>
  <text x="870" y="342" class="boxText">Starts <tspan class="mono">CaptionsApp</tspan> and registers Mentra routes</text>
  <text x="870" y="365" class="boxText">Serves <tspan class="mono">/webhook</tspan>, <tspan class="mono">/photo-upload</tspan>, <tspan class="mono">/api/stream</tspan></text>
  <text x="870" y="388" class="boxText">Handles language endpoint compatibility</text>
  <text x="870" y="411" class="boxText">Proxies unmatched HTTP requests to Bun</text>
  <text x="870" y="434" class="boxText">Maintains session connectivity with Mentra Cloud</text>

  <rect x="432" y="510" width="270" height="170" class="node" />
  <text x="454" y="538" class="stereotype">&lt;&lt;service&gt;&gt;</text>
  <text x="454" y="570" class="boxTitle">gemini-ocr.ts</text>
  <text x="454" y="595" class="mono">extractTextFromImageWithGemini()</text>
  <text x="454" y="626" class="boxText">Builds OCR prompt + image payload</text>
  <text x="454" y="649" class="boxText">Retries transient failures</text>
  <text x="454" y="672" class="boxText">Falls back across Gemini models</text>

  <rect x="734" y="510" width="270" height="170" class="node" />
  <text x="756" y="538" class="stereotype">&lt;&lt;service&gt;&gt;</text>
  <text x="756" y="570" class="boxTitle">gemini-translate.ts</text>
  <text x="756" y="595" class="mono">translateText()</text>
  <text x="756" y="626" class="boxText">Detects source language</text>
  <text x="756" y="649" class="boxText">Translates into target language</text>
  <text x="756" y="672" class="boxText">Reuses retry and fallback policy</text>

  <rect x="1036" y="510" width="296" height="170" class="node" />
  <text x="1058" y="538" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="1058" y="570" class="boxTitle">SSEManager</text>
  <text x="1058" y="595" class="mono">src/api/sse-stream.ts</text>
  <text x="1058" y="626" class="boxText">Broadcasts status / OCR / translation events</text>
  <text x="1058" y="649" class="boxText">Tracks connected EventSource clients</text>
  <text x="1058" y="672" class="boxText">Emits 15s heartbeat messages</text>

  <rect x="432" y="716" width="386" height="190" class="node" />
  <text x="456" y="744" class="stereotype">&lt;&lt;service&gt;&gt;</text>
  <text x="456" y="776" class="boxTitle">Bun Web Server</text>
  <text x="456" y="801" class="mono">src/index.ts    port 3334</text>
  <text x="456" y="832" class="boxText">Serves <tspan class="mono">src/webview/index.html</tspan></text>
  <text x="456" y="855" class="boxText">Exposes Bun routes and static assets</text>
  <text x="456" y="878" class="boxText">Provides the React webview without a build step</text>

  <rect x="852" y="716" width="480" height="190" class="node" />
  <text x="876" y="744" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="876" y="776" class="boxTitle">routes.ts</text>
  <text x="876" y="801" class="mono">src/api/routes.ts</text>
  <text x="876" y="832" class="boxText">Stores in-memory <tspan class="mono">targetLanguage</tspan></text>
  <text x="876" y="855" class="boxText">Handles <tspan class="mono">GET/POST /api/settings/language</tspan></text>
  <text x="876" y="878" class="boxText">Supplies <tspan class="mono">getTargetLanguage()</tspan> to CaptionsApp</text>

  <rect x="1404" y="140" width="344" height="820" class="panel" />
  <text x="1430" y="178" class="section">Client Side</text>

  <rect x="1438" y="226" width="276" height="258" class="nodeAccent" />
  <text x="1460" y="254" class="stereotype">&lt;&lt;frontend&gt;&gt;</text>
  <text x="1460" y="286" class="boxTitle">React Webview</text>
  <text x="1460" y="311" class="mono">App.tsx + frontend.tsx</text>
  <text x="1460" y="342" class="boxText">Shows app status and translation history</text>
  <text x="1460" y="365" class="boxText">Displays OCR/translation results</text>
  <text x="1460" y="388" class="boxText">Lets user choose target language</text>
  <text x="1460" y="411" class="boxText">Runs in browser or Mentra webview surface</text>

  <rect x="1438" y="530" width="276" height="194" class="node" />
  <text x="1460" y="558" class="stereotype">&lt;&lt;hook&gt;&gt;</text>
  <text x="1460" y="590" class="boxTitle">useTranslationStream()</text>
  <text x="1460" y="615" class="mono">src/webview/hooks/useTranslationStream.ts</text>
  <text x="1460" y="646" class="boxText">Opens <tspan class="mono">EventSource(/api/stream)</tspan></text>
  <text x="1460" y="669" class="boxText">Reconnects with exponential backoff</text>
  <text x="1460" y="692" class="boxText">Converts SSE events into UI state</text>

  <rect x="1438" y="770" width="276" height="156" class="note" />
  <text x="1460" y="800" class="boxTitle" style="font-size:18px;">Primary User Flow</text>
  <text x="1460" y="830" class="legendText">1. Button press on glasses</text>
  <text x="1460" y="852" class="legendText">2. Photo capture via Mentra session</text>
  <text x="1460" y="874" class="legendText">3. OCR, then translation</text>
  <text x="1460" y="896" class="legendText">4. Text wall + spoken result + SSE updates</text>

  <path d="M 206 320 L 206 360" class="solid" />
  <text x="222" y="344" class="label">short press</text>

  <path d="M 326 436 C 372 436 392 408 432 382" class="solid" />
  <text x="334" y="404" class="label">button press reaches session</text>

  <path d="M 326 640 C 372 640 402 640 432 640" class="solid" />
  <text x="334" y="620" class="label">webhook + WebSocket</text>

  <path d="M 432 418 C 364 450 350 492 326 560" class="solid" />
  <text x="356" y="500" class="label">requestPhoto()</text>

  <path d="M 326 706 C 376 736 396 754 432 790" class="solid" />
  <text x="340" y="742" class="label">web traffic enters local runtime</text>

  <path d="M 326 838 C 392 838 392 610 432 595" class="accent" />
  <text x="336" y="816" class="label">OCR request</text>

  <path d="M 326 870 C 426 870 642 870 734 620" class="accent" />
  <text x="432" y="852" class="label">translation request</text>

  <path d="M 812 346 L 846 346" class="dashed" />
  <text x="818" y="334" class="label">hosted by</text>

  <path d="M 676 466 L 676 510" class="solid" />
  <text x="692" y="492" class="label">photo buffer</text>

  <path d="M 870 466 L 870 510" class="solid" />
  <text x="886" y="492" class="label">extracted text</text>

  <path d="M 812 386 C 918 418 990 462 1090 510" class="solid" />
  <text x="938" y="438" class="label">broadcast status / results</text>

  <path d="M 812 332 C 964 312 1112 294 1438 336" class="dashed" />
  <text x="1060" y="286" class="label">proxy / serve webview</text>

  <path d="M 625 716 C 625 700 625 696 625 680" class="dashed" />
  <text x="646" y="700" class="label">Bun route source</text>

  <path d="M 1092 716 C 1092 704 1092 698 1092 680" class="dashed" />
  <text x="1112" y="702" class="label">settings shared</text>

  <path d="M 1004 620 L 1036 620" class="solid" />
  <text x="1010" y="608" class="label">translation_result</text>

  <path d="M 1332 620 C 1384 620 1396 620 1438 620" class="solid" />
  <text x="1342" y="608" class="label">EventSource /api/stream</text>

  <path d="M 1332 808 C 1382 808 1392 800 1438 800" class="solid" />
  <text x="1342" y="790" class="label">GET / POST language</text>

  <path d="M 1438 392 C 1342 392 1258 392 812 808" class="dashed" />
  <text x="1188" y="454" class="label">reads / updates targetLanguage</text>

  <path d="M 818 800 C 836 800 840 800 852 800" class="dashed" />
  <text x="818" y="786" class="label">imports</text>

  <path d="M 852 838 C 740 838 662 808 622 680" class="dashed" />
  <text x="706" y="812" class="label">Bun serves route handlers</text>

  <path d="M 432 300 C 386 300 364 300 326 300" class="solid" />
  <text x="334" y="286" class="label">ready / speak / showTextWall</text>

  <path d="M 326 464 C 384 464 402 454 432 454" class="solid" />
  <text x="336" y="446" class="label">photo upload resolves request</text>

  <rect x="70" y="988" width="1660" height="126" class="note" />
  <text x="96" y="1020" class="boxTitle" style="font-size:20px;">What This Diagram Emphasizes</text>
  <text x="96" y="1048" class="legendText">The current app combines a Mentra session runtime, a Bun-served React frontend, shared language settings, live SSE updates, Gemini OCR, and Gemini translation.</text>
  <text x="96" y="1074" class="legendText">Key sources: <tspan class="mono">src/index.ts</tspan>, <tspan class="mono">src/app/CaptionsApp.ts</tspan>, <tspan class="mono">src/api/routes.ts</tspan>, <tspan class="mono">src/api/sse-stream.ts</tspan>, <tspan class="mono">src/services/gemini-ocr.ts</tspan>, <tspan class="mono">src/services/gemini-translate.ts</tspan>.</text>
  <text x="96" y="1098" class="caption">Drafted on 2026-04-08</text>
</svg>
